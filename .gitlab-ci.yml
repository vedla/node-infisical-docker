# You can override the included template(s) by including variable overrides
# SAST customization: https://docs.gitlab.com/user/application_security/sast/#available-cicd-variables
# Secret Detection customization: https://docs.gitlab.com/user/application_security/secret_detection/pipeline/configure/
# Dependency Scanning customization: https://docs.gitlab.com/user/application_security/dependency_scanning/dependency_scanning_sbom/#customizing-analyzer-behavior
# Container Scanning customization: https://docs.gitlab.com/user/application_security/container_scanning/#customizing-analyzer-behavior
# Note that environment variables can be set in several places
# See https://docs.gitlab.com/ci/variables/#cicd-variable-precedence
stages:
  - test
  - secret-detection
  - build
  - release
sast:
  stage: test
include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml
variables:
  SECRET_DETECTION_ENABLED: 'true'
  DOCKER_BUILDKIT: 1
secret_detection:
  stage: secret-detection

# Sanity-checks that the Dockerfile still builds on every branch push (no push to a registry —
# just `docker build --load`). Also drives the coverage badge: 100% on a successful build, 0% on
# a failed one, since there's no real test suite to measure line coverage against.
build-check:
  image: docker:24.0.2
  stage: test
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
  rules:
    - if: '$CI_COMMIT_TAG'
      when: never
    - when: on_success
  script:
    - until docker info >/dev/null 2>&1; do echo "waiting for docker daemon..."; sleep 1; done
    - 'docker build --build-arg NODE_VERSION=24-slim -t node-infisical:build-check . && echo "Build check: 100%" || (echo "Build check: 0%" && exit 1)'
  coverage: '/Build check: (\d+)%/'

# Runs once per Node version whenever a release tag is pushed (see the `release` job below).
# Update this matrix when preparing a release to control which Node versions get built —
# check https://nodejs.org/en/about/previous-releases for the current LTS schedule.
build-images:
  image: docker:24.0.2
  stage: build
  services:
    - name: docker:24.0.2-dind
      alias: docker
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    DOCKER_DRIVER: overlay2
  parallel:
    matrix:
      - NODE_VERSION:
          - '22-slim' # Maintenance LTS
          - '24-slim' # Active LTS
          - '25-slim' # Current
  before_script:
    - apk add --no-cache curl git bash
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin "$CI_REGISTRY"
  script:
    - until docker info >/dev/null 2>&1; do echo "waiting for docker daemon..."; sleep 1; done
    - docker run --privileged --rm tonistiigi/binfmt --install all
    - docker buildx create --name multiarch --use || docker buildx use multiarch
    - docker buildx inspect --bootstrap
    - |
      NODE_TAG="${NODE_VERSION%-slim}"
      docker buildx build \
        --platform linux/amd64,linux/arm64 \
        --build-arg NODE_VERSION="$NODE_VERSION" \
        --tag "$CI_REGISTRY_IMAGE:node-$NODE_TAG" \
        --tag "$CI_REGISTRY_IMAGE:$CI_COMMIT_TAG-node-$NODE_TAG" \
        --push .
  rules:
    - if: '$CI_COMMIT_TAG'

# Creates the GitLab Release entry for the tag once every image in the matrix above has built.
release:
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  stage: release
  needs:
    - build-images
  rules:
    - if: '$CI_COMMIT_TAG'
  script:
    - echo "Creating release $CI_COMMIT_TAG"
  release:
    tag_name: '$CI_COMMIT_TAG'
    description: 'Release $CI_COMMIT_TAG'
