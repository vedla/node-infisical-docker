name: Build and release images

# Mirrors the GitLab pipeline (.gitlab-ci.yml) so the GitHub mirror publishes its own images and
# release once GitLab pushes a tag here. Keep the NODE_VERSION matrix below in sync with the one
# in .gitlab-ci.yml.
#
# The weekly schedule rebuilds the moving `node-XX` tags from fresh base images, so they pick up
# Debian, Node, and Infisical CLI security fixes between releases. Scheduled and manual runs never
# touch the `<tag>-node-XX` release tags and never create a release. GitHub only runs schedules on
# the default branch, and disables them after 60 days without repository activity.

on:
  push:
    tags:
      - '*'
  schedule:
    - cron: '0 4 * * 1' # Mondays 04:00 UTC
  workflow_dispatch:

concurrency:
  group: build-images-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  packages: write

jobs:
  build-images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node_version:
          - '22-slim' # Maintenance LTS
          - '24-slim' # Active LTS
          - '26-slim' # Current
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build, smoke-test, and push
        env:
          NODE_VERSION: ${{ matrix.node_version }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: sh scripts/build-and-push.sh "ghcr.io/${{ github.repository }}" "$NODE_VERSION" "$RELEASE_TAG"

  release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    needs: build-images
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" --generate-notes
